name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

# uploading to a release needs write access, which workflows of a fork don't get by default
permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: 21
          java-package: jdk+fx
          architecture: x64

      - name: Build
        run: ./gradlew build shadowJar jpackage --stacktrace --warning-mode all

      # the app image carries its own runtime with JavaFX, so the zip runs without an installer or Java
      - name: Package
        shell: bash
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mkdir -p build/release
          7z a "build/release/mcaselector-$version-windows-x64.zip" "./build/jpackage/MCA Selector"
          cp "build/libs/mcaselector-$version-all.jar" "build/release/mcaselector-$version.jar"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/release/*

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v3.0
        with:
          files: build/release/*
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  publish-unix:
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- MACOS ---
          - os: macos-latest
            arch: aarch64
            type: dmg
          - os: macos-26-intel
            arch: x64
            type: dmg

          # --- LINUX DEB ---
          - os: ubuntu-22.04
            arch: x64
            type: deb
            container_image: debian:bookworm
          - os: ubuntu-22.04-arm
            arch: aarch64
            type: deb
            container_image: debian:bookworm

          # --- LINUX RPM ---
          - os: ubuntu-22.04
            arch: x64
            type: rpm
            container_image: fedora:latest
          - os: ubuntu-22.04-arm
            arch: aarch64
            type: rpm
            container_image: fedora:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Dependencies (DEB)
        if: matrix.type == 'deb'
        run: |
          apt-get update -qq
          apt-get install -qq -y ca-certificates findutils binutils fakeroot debhelper

      - name: Install Dependencies (RPM)
        if: matrix.type == 'rpm'
        run: |
          dnf install -y findutils tar gzip binutils rpm-build

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: zulu
          java-package: jdk+fx
          architecture: ${{ matrix.arch }}

      - name: Build
        run: |
          chmod +x ./gradlew
          chmod +x ./installer/init
          ./gradlew build shadowJar --stacktrace --warning-mode all
          mkdir -p build/licenses
          ./installer/init . build/licenses/LICENSE
          ./gradlew jpackage -PmatrixType=${{ matrix.type }} --stacktrace --warning-mode all
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mv build/jpackage/*.${{ matrix.type }} build/jpackage/mcaselector-$version-${{ matrix.arch }}.${{ matrix.type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.type }}-${{ matrix.arch }}
          path: build/jpackage/*.${{ matrix.type }}

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v3.0
        with:
          files: build/jpackage/*.${{ matrix.type }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
